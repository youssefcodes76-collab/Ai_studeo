<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>استوديو الإبداع بالذكاء الاصطناعي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f1fa;--panel:#fff;--ink:#1d1a2e;--mute:#6b6785;--line:#dcd8ee;--acc:#5b3df5;--acc2:#e6e0ff;--err:#c4283c}
@media(prefers-color-scheme:dark){:root{--bg:#14121f;--panel:#1d1a2e;--ink:#f1eefc;--mute:#9a96b8;--line:#322e4d;--acc:#8b74ff;--acc2:#2b2550;--err:#ff7a8a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;line-height:1.6}
.wrap{max-width:1100px;margin:auto;padding:20px}
h1{font-size:2rem;font-weight:800;margin:10px 0 4px}
.sub{color:var(--mute);margin:0 0 20px}
.grid{display:grid;grid-template-columns:380px 1fr;gap:20px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.tabs{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:10px;margin-bottom:14px}
.tab{flex:1;border:0;background:none;color:var(--mute);padding:9px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
.tab.on{background:var(--acc);color:#fff}
label{display:block;font-size:.9rem;font-weight:600;margin:12px 0 5px}
textarea,input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:110px;resize:vertical}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.go{width:100%;margin-top:16px;padding:12px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer}
.go:disabled{opacity:.5;cursor:wait}
.out{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.item{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.item img,.item video{width:100%;display:block;aspect-ratio:1/1;object-fit:cover;background:#000}
.meta{padding:10px;font-size:.85rem}
.meta p{margin:0 0 8px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta a{color:var(--acc);font-weight:600;text-decoration:none}
.state{padding:40px 10px;text-align:center;color:var(--mute)}
.err{color:var(--err);font-size:.9rem;margin-top:10px;min-height:1.2em}
.spin{width:34px;height:34px;border:4px solid var(--acc2);border-top-color:var(--acc);border-radius:50%;animation:s 1s linear infinite;margin:0 auto 10px}
@keyframes s{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>استوديو الإبداع</h1>
  <p class="sub">اكتب وصفك، واحصل على صورة أو فيديو بالذكاء الاصطناعي.</p>

  <div class="grid">
    <div class="card">
      <div class="tabs" role="tablist">
        <button class="tab on" data-mode="image" role="tab">صورة</button>
        <button class="tab" data-mode="video" role="tab">فيديو</button>
      </div>

      <label for="prompt">الوصف</label>
      <textarea id="prompt" placeholder="مثال: قطة ترتدي بدلة فضاء تمشي على سطح القمر"></textarea>

      <label for="neg">ما لا تريده في النتيجة (اختياري)</label>
      <input id="neg" placeholder="مثال: ضبابي، نص، تشوهات">

      <div id="imgOpts" class="row">
        <div><label for="size">المقاس</label>
          <select id="size"><option>1024x1024</option><option>1024x1792</option><option>1792x1024</option></select></div>
        <div><label for="count">العدد</label>
          <select id="count"><option>1</option><option>2</option><option>4</option></select></div>
      </div>

      <div id="vidOpts" class="row" hidden>
        <div><label for="dur">المدة (ثانية)</label>
          <select id="dur"><option>4</option><option>8</option><option>10</option></select></div>
        <div><label for="ratio">النسبة</label>
          <select id="ratio"><option>16:9</option><option>9:16</option><option>1:1</option></select></div>
      </div>

      <button class="go" id="go">إنشاء</button>
      <div class="err" id="err" role="alert"></div>
    </div>

    <div class="card">
      <div class="out" id="out"><div class="state" style="grid-column:1/-1">نتائجك ستظهر هنا. اكتب وصفًا واضغط «إنشاء».</div></div>
    </div>
  </div>
</div>

<script>
/* =====================================================
   الإعدادات: عدّل هذا الجزء فقط ليتوافق مع مزوّد الـ API
   ===================================================== */
const CONFIG = {
  // ضع مفتاح الـ API هنا (للتجربة فقط. للإنتاج استخدم سيرفر وسيط يخفي المفتاح)
  apiKey: "YOUR_API_KEY_HERE",

  imageEndpoint: "https://api.example.com/v1/images/generations",
  videoEndpoint: "https://api.example.com/v1/videos/generations",
  // رابط الاستعلام عن حالة الفيديو؛ {id} يُستبدل برقم المهمة
  videoStatusEndpoint: "https://api.example.com/v1/videos/generations/{id}",
  pollIntervalMs: 4000,
  pollMaxTries: 90,

  headers: () => ({
    "Content-Type": "application/json",
    "Authorization": "Bearer " + CONFIG.apiKey
  }),

  // جسم طلب الصورة: عدّله حسب توثيق المزوّد
  imageBody: (p) => ({
    prompt: p.prompt,
    negative_prompt: p.negative || undefined,
    size: p.size,
    n: p.count
  }),
  // استخراج روابط الصور من الرد
  imageParse: (data) => (data.data || []).map(d => d.url || ("data:image/png;base64," + d.b64_json)),

  videoBody: (p) => ({
    prompt: p.prompt,
    negative_prompt: p.negative || undefined,
    duration: p.duration,
    aspect_ratio: p.ratio
  }),
  // رقم المهمة من رد الإنشاء (للمزودين الذين يعملون بنظام المهام)
  videoJobId: (data) => data.id || data.task_id || null,
  // من رد الاستعلام: هل انتهى؟ وما رابط الفيديو؟
  videoDone: (data) => ["succeeded", "completed", "done"].includes((data.status || "").toLowerCase()),
  videoFailed: (data) => ["failed", "error"].includes((data.status || "").toLowerCase()),
  videoUrl: (data) => data.url || data.video_url || (data.output && data.output[0]) || null
};

/* ---------------- الواجهة ---------------- */
const $ = id => document.getElementById(id);
let mode = "image";

document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  mode = t.dataset.mode;
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === t));
  $("imgOpts").hidden = mode !== "image";
  $("vidOpts").hidden = mode !== "video";
});

const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function showLoading(msg){
  $("out").innerHTML = `<div class="state" style="grid-column:1/-1"><div class="spin"></div>${msg}</div>`;
}
function addResult(url, prompt, isVideo){
  const media = isVideo
    ? `<video src="${url}" controls loop playsinline></video>`
    : `<img src="${url}" alt="${esc(prompt)}">`;
  const el = document.createElement("div");
  el.className = "item";
  el.innerHTML = media + `<div class="meta"><p>${esc(prompt)}</p><a href="${url}" download="${isVideo ? "video.mp4" : "image.png"}" target="_blank" rel="noopener">تنزيل</a></div>`;
  $("out").appendChild(el);
}

async function api(url, opts){
  const res = await fetch(url, opts);
  if (!res.ok) {
    let detail = "";
    try { detail = (await res.json()).error?.message || ""; } catch(e){}
    throw new Error(`فشل الطلب (${res.status}). ${detail}`);
  }
  return res.json();
}

async function makeImages(p){
  const data = await api(CONFIG.imageEndpoint, {
    method: "POST", headers: CONFIG.headers(), body: JSON.stringify(CONFIG.imageBody(p))
  });
  const urls = CONFIG.imageParse(data);
  if (!urls.length) throw new Error("لم يرجع الـ API أي صورة. راجع imageParse في الإعدادات.");
  return urls;
}

async function makeVideo(p){
  const data = await api(CONFIG.videoEndpoint, {
    method: "POST", headers: CONFIG.headers(), body: JSON.stringify(CONFIG.videoBody(p))
  });
  const direct = CONFIG.videoUrl(data);
  if (direct && !CONFIG.videoJobId(data)) return direct;
  const id = CONFIG.videoJobId(data);
  if (!id) throw new Error("لم يرجع الـ API رقم مهمة ولا رابط فيديو. راجع videoJobId.");
  for (let i = 0; i < CONFIG.pollMaxTries; i++) {
    await sleep(CONFIG.pollIntervalMs);
    const st = await api(CONFIG.videoStatusEndpoint.replace("{id}", id), { headers: CONFIG.headers() });
    if (CONFIG.videoFailed(st)) throw new Error("فشل إنشاء الفيديو من جهة المزوّد.");
    if (CONFIG.videoDone(st)) {
      const u = CONFIG.videoUrl(st);
      if (u) return u;
    }
  }
  throw new Error("استغرق الفيديو وقتًا أطول من المتوقع. حاول مرة أخرى.");
}

$("go").onclick = async () => {
  const prompt = $("prompt").value.trim();
  $("err").textContent = "";
  if (!prompt) { $("err").textContent = "اكتب وصفًا أولًا."; return; }
  if (CONFIG.apiKey === "YOUR_API_KEY_HERE") { $("err").textContent = "لم يتم ربط الـ API بعد. عدّل CONFIG في الكود."; return; }

  const p = { prompt, negative: $("neg").value.trim(), size: $("size").value, count: +$("count").value,
              duration: +$("dur").value, ratio: $("ratio").value };
  $("go").disabled = true;
  showLoading(mode === "image" ? "جارٍ إنشاء الصور…" : "جارٍ إنشاء الفيديو، قد يستغرق دقيقة أو أكثر…");
  try {
    const urls = mode === "image" ? await makeImages(p) : [await makeVideo(p)];
    $("out").innerHTML = "";
    urls.forEach(u => addResult(u, prompt, mode === "video"));
  } catch (e) {
    $("out").innerHTML = `<div class="state" style="grid-column:1/-1">لم تظهر نتيجة. راجع الرسالة تحت زر «إنشاء».</div>`;
    $("err").textContent = e.message + (e instanceof TypeError ? " (قد تكون المشكلة CORS: استخدم سيرفر وسيط)" : "");
  } finally {
    $("go").disabled = false;
  }
};
</script>
</body>
        </html>
